name: probe
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe_pokemon.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_pokemon.py > probe.txt 2>&1; tail -c 60000 probe.txt
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe.txt}
