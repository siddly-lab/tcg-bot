name: ci
on:
  pull_request:
  push:
    branches: ["claude/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt -r bot/requirements.txt
      - run: python -m pytest -q
  live-build:
    # Runs the real pipeline against today's prices so a change in TCGplayer's data shows up here, not on the live page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m tcg.build --no-backfill
      - name: Data audit report
        run: python -m tcg.audit
      - name: Discord bot messages on today's real data
        run: pip install -r bot/requirements.txt >/dev/null && python tests/live_bot_check.py site/data
      - name: Layout check (phone, tablet, laptop, wide) on today's real data
        run: |
          npm install --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd site && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node tests/layout/check.js http://localhost:8765/
      - uses: actions/upload-artifact@v4
        with: {name: site-preview, path: site, retention-days: 7}
  bot-container:
    # Builds the bot's Docker image the way the NAS does and makes sure it starts up to the point of logging in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch .env && docker compose config -q
      - run: docker build -t tcg-bot-test ./bot
      - name: Start the bot with a fake token (should stop at the Discord login, not before)
        run: |
          docker run --rm -e DISCORD_TOKEN=fake -e DB_PATH=/tmp/x.sqlite3 -v "$PWD/bot:/app/code:ro" tcg-bot-test > out.txt 2>&1 || true
          cat out.txt | tail -20
          grep -qiE "LoginFailure|Improper token|401" out.txt
      - run: sh -n deploy/updater-loop.sh && bash -n deploy/install.sh
