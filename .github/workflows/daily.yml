name: daily
# Pulls today's prices for every game, saves them to the history, rebuilds the dashboard and publishes it.
on:
  schedule:
    - cron: "25 21 * * *"   # tcgcsv refreshes around 20:00 UTC (1pm Pacific)
    - cron: "17 10 * * *"   # backup run (about 2-3am Pacific): re-publishes if the first run didn't, otherwise changes nothing
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tcg/**", "site/**", "config/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Pull prices, fill any history gaps, build the dashboard data
        run: python -m tcg.build
      - name: Save today's prices to the history
        run: |
          git config user.name "tcg-bot"
          git config user.email "tcg-bot@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Prices for $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
      - name: Layout check before publishing (a broken page never goes live)
        run: |
          npm install --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd site && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node tests/layout/check.js http://localhost:8765/
      - name: Stamp this build so browsers load fresh files
        run: sed -i "s/__BUILD__/$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    # GitHub's hosting occasionally gets stuck uploading. Try up to three times, waiting between tries,
    # so a hiccup on their side fixes itself instead of failing the day.
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with: {timeout: 900000}
      - if: steps.deploy.outcome == 'failure'
        run: echo "GitHub Pages didn't finish, trying again in 2 minutes" && sleep 120
      - id: retry1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with: {timeout: 900000}
      - if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: echo "Still stuck, one last try in 10 minutes" && sleep 600
      - id: retry2
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: {timeout: 900000}
