name: daily
# Pulls today's prices, saves them to the history, rebuilds the dashboard and publishes it.
on:
  schedule:
    - cron: "25 21 * * *"   # tcgcsv refreshes around 20:00 UTC (1pm Pacific)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Fill in missing price history from the daily archives"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tcg/**", "site/**", "config/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Backfill price history (first run, or when asked)
        if: ${{ inputs.backfill || hashFiles('data/history/*.json.gz') == '' }}
        run: pip install py7zr && python -m tcg.backfill
      - run: python -m tcg.build
      - name: Save today's prices to the history
        run: |
          git config user.name "tcg-bot"
          git config user.email "tcg-bot@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Prices for $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
