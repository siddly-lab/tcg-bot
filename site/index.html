<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foil</title>
<meta name="description" content="Foil: daily trading card prices, booster box value, pull odds, buy timing and sealed returns for Riftbound and Pokémon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#/" aria-label="Foil home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="5" y="7" width="15" height="21" rx="3" fill="var(--accent)" opacity=".35" transform="rotate(-10 12 17)"/><rect x="11" y="4" width="15" height="21" rx="3" fill="var(--accent)"/><path d="M15 15l3-5 3 5-3 5z" fill="var(--on-accent)"/></svg>
      <span>Foil</span>
    </a>
    <div class="game-switch" id="games" role="tablist" aria-label="Game"></div>
    <button id="theme" class="icon-btn" aria-label="Switch light or dark mode" title="Light or dark mode">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections">
    <a data-view="today">Today</a>
    <a data-view="sets">Sets</a>
    <a data-view="sealed">Sealed</a>
    <a data-view="cards">Cards</a>
    <a data-view="movers">Movers</a>
    <a data-view="how">How it works</a>
  </nav>
</header>
<main class="wrap" id="view" aria-live="polite"><p class="muted pad">Loading prices…</p></main>
<footer class="wrap muted small">Prices from TCGplayer via tcgcsv.com, refreshed daily. <span id="stamp"></span> Not affiliated with Riot Games, The Pokémon Company or TCGplayer. Not financial advice.</footer>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="Card details"><button class="icon-btn close" aria-label="Close">✕</button><div id="modal-body"></div></div></div>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
